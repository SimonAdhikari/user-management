# MySQL configuration for the Social Hub local development server.
# Data directory lives inside the project so no admin rights are needed.
[mysqld]
port=3306
bind-address=127.0.0.1
datadir=E:/oop/project/mysql_data
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
max_connections=50

[client]
port=3306
default-character-set=utf8mb4

<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="none" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ringGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#6366f1"/>
    </radialGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1230"/>
      <stop offset="0.55" stop-color="#141a45"/>
      <stop offset="1" stop-color="#232a6e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="19" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="19" stroke="rgba(129,140,248,0.4)" stroke-width="1.5" fill="none"/>
  <circle cx="32" cy="32" r="17.5" stroke="url(#ringGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7" opacity="0.85"/>
  <g stroke="url(#ringGrad)" stroke-width="2.2" stroke-linecap="round" opacity="0.55">
    <line x1="32" y1="32" x2="32" y2="14.5"/>
    <line x1="32" y1="32" x2="47.2" y2="40.8"/>
    <line x1="32" y1="32" x2="16.8" y2="40.8"/>
  </g>
  <circle cx="32" cy="14.5" r="4.6" fill="url(#nodeGrad)" stroke="#0b1230" stroke-width="1.6"/>
  <circle cx="47.2" cy="40.8" r="4.6" fill="url(#nodeGrad)" stroke="#0b1230" stroke-width="1.6"/>
  <circle cx="16.8" cy="40.8" r="4.6" fill="url(#nodeGrad)" stroke="#0b1230" stroke-width="1.6"/>
  <circle cx="32" cy="32" r="11.5" fill="url(#coreGrad)" opacity="0.28"/>
  <circle filter="url(#glow)" cx="32" cy="32" r="8.4" fill="url(#coreGrad)" stroke="rgba(255,255,255,0.65)" stroke-width="1.4"/>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Hub QR Code Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        .qr-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .qr-section h2 {
            color: #667eea;
            font-size: 1.3rem;
            margin-bottom: 20px;
        }
        .qr-code {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            display: inline-block;
            border: 2px solid #f0f0f0;
        }
        #qr-code {
            max-width: 300px;
        }
        .url-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            word-break: break-all;
            color: #666;
        }
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        button:hover {
            background: #764ba2;
        }
        button.secondary {
            background: #ccc;
        }
        button.secondary:hover {
            background: #bbb;
        }
        .download-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            border-left: 4px solid #667eea;
        }
        .download-section h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .download-btn {
            background: #10b981;
            width: 100%;
            margin-top: 10px;
        }
        .download-btn:hover {
            background: #059669;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Social Hub Mobile</h1>
        
        <div class="qr-section">
            <h2>Scan to Download</h2>
            <div class="qr-code" id="qr-code"></div>
            
            <div class="url-info">
                <strong>URL:</strong><br>
                https://november-pub-pmid-ahead.trycloudflare.com
            </div>
            
            <div class="button-group">
                <button onclick="copyURL()">📋 Copy Link</button>
                <button class="secondary" onclick="downloadQR()">⬇️ Download QR</button>
            </div>
        </div>

        <div class="download-section">
            <h3>📲 Installation Instructions</h3>
            <p><strong>Android:</strong> Open the link → Tap ⋮ → "Add to Home Screen"</p>
            <p><strong>iOS:</strong> Open the link → Share → "Add to Home Screen"</p>
            <button class="download-btn" onclick="openApp()">🚀 Open Social Hub Now</button>
        </div>
    </div>

    <script>
        const appURL = 'https://november-pub-pmid-ahead.trycloudflare.com';
        
        // Generate QR Code
        new QRCode(document.getElementById('qr-code'), {
            text: appURL,
            width: 300,
            height: 300,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });

        function copyURL() {
            navigator.clipboard.writeText(appURL).then(() => {
                alert('✓ Link copied to clipboard!');
            });
        }

        function downloadQR() {
            const canvas = document.querySelector('#qr-code canvas');
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'social-hub-qr-code.png';
            link.click();
        }

        function openApp() {
            window.location.href = appURL;
        }
    </script>
</body>
</html>
